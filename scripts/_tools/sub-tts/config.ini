[paths]

# ==============================================================================
# External Tools
# ==============================================================================

# All paths can be absolute or relative to the sub-tts directory.
# Use forward slashes (/) for paths, even on Windows.

# Full path to the root of the piper-tts project.
# This directory must contain piper_tts.py and a valid config.ini.
piper_tts_root = U:/voothi/20241206010110-piper-tts

# Full path to the ffmpeg executable.
ffmpeg_executable = C:/Tools/ffmpeg/ffmpeg-7.1-essentials_build/bin/ffmpeg.exe

# Full path to the zid.py script (used for ZID-based duplicate handling).
# Leave empty to use datetime.now() as fallback.
zid_script = U:/voothi/20241116203211-zid/zid.py


[tts_settings]

# ==============================================================================
# Language and Output Naming
# ==============================================================================

# The default language to use when no language postfix is found in the filename.
# Must match a language code supported by the Piper TTS config.ini (e.g., en, de, ru).
default_lang = en

# Prioritized list of languages (comma-separated) to treat as the primary/timeline
# source of truth. When processing multiple files, the file matching the highest
# priority language present is processed first to establish the canonical timeline.
# Supports regional/locale suffixes (e.g. 'en_US' or 'en-US' will match 'en').
# Fallback: defaults to the 'default_lang' setting if empty.
primary_languages = en, de

# Keep the language postfix in the output MP4 filename (e.g. video.de.mp4 instead
# of video.mp4) in accordance with the postfix in the SRT file.
keep_lang_postfix = true


# ==============================================================================
# Duplicate Handling
# ==============================================================================

# How to handle output filename duplicates. Applies to both the .mp4 output and,
# on a name collision, the synced .srt companion (so the two never disagree).
# zid-dir  : route to a new ZID-named subdirectory (recommended). On an SRT
#            collision, the original source SRT is archived into <ZID>/ and the
#            synced version is written to the root path.
# skip     : skip conversion if the output file already exists. On an SRT
#            collision, the source SRT is left untouched and the synced copy is
#            written into <ZID>/ instead.
# overwrite: overwrite the existing output file (and the source SRT in place).
duplicate_mode = zid-dir


# ==============================================================================
# Timeline Strategy
# ==============================================================================

# Defines what dictates the final timeline (the source of truth). A single enum
# that also encodes the former shift/fallback booleans, so every value is
# meaningful (no silently-ignored combinations):
#
# primary_subtitle                   : the original SRT timing is the absolute
#                                      truth; generated audio is sped up to fit
#                                      each subtitle slot.
# primary_subtitle_shift             : like primary_subtitle, but when audio still
#                                      overflows after speed-up, shift the later
#                                      cues later in time to make room (the
#                                      subtitle yields slightly to the audio).
# primary_audio                      : the canonical track's native TTS audio is
#                                      the truth; the timeline is rebuilt around it
#                                      and secondary tracks are sped up to fit.
# primary_audio_or_subtitle_fallback : like primary_audio, but if the canonical
#                                      output already exists and no sidecar JSON is
#                                      available, fall back to primary_subtitle to
#                                      avoid re-synthesizing the canonical track.
timeline_source = primary_audio_or_subtitle_fallback

# Reuse the canonical track's existing output instead of regenerating it: if the
# canonical media (e.g. video.mp4 / video.de.mp4 / .mp3) already exists, skip its
# assembly and muxing; if it does NOT exist, generate it anyway. The canonical
# track's SRT is still processed to establish the timeline either way.
reuse_canonical_output = true

# When only a secondary-language file is passed (e.g. video.ru.srt), search the
# directory for the corresponding canonical-language file (e.g. video.en.srt,
# video.de.srt, or video.srt) to establish the timeline. The auto-discovered
# canonical file's output is reused rather than regenerated.
auto_discover_canonical = true

# If true, delete the .shift_plan.json sidecar file(s) after a fully successful run.
# The sidecar is only needed to skip re-synthesizing the canonical track on a
# separate subsequent invocation (primary_audio modes). If you always process all
# languages together in a single run, set this to true to keep the directory clean.
cleanup_sidecar_on_success = true


# ==============================================================================
# Timing and Audio Quality
# ==============================================================================

# Optional VAD-like pause compression before tempo adjustment.
vad_silence_compression = true
vad_max_silence_seconds = 0.15

# Prefer FFmpeg's rubberband filter for better pitch-preserving speed changes
# when the local FFmpeg build supports it; otherwise the tool falls back to atempo.
high_quality_time_stretch = true

# Subtitle Edit permits up to 1000ms of the gap before the next subtitle to avoid
# unnecessary speed-up when there is room after the cue.
max_extra_gap_ms = 1000

# Cap automatic speed-up. Increase if you prefer strict subtitle fit over
# natural-sounding speech.
max_speed_factor = 2.0


# ==============================================================================
# Console
# ==============================================================================

# Console auto-close timeout in seconds (on successful runs in SendTo/pause mode).
# Set to 0 to close instantly; ignored on errors so they can be inspected.
# Default: 15
auto_close_timeout_secs =


[lang_aliases]

# ==============================================================================
# Language Aliases
# ==============================================================================

# Optional: Map subtitle filename postfixes to Piper language codes.
# Format: <postfix> = <language_code>
# These override the built-in alias table.
eng = en
ger = de
rus = ru
ukr = uk
