[paths]
piper_tts_root = U:/voothi/20241206010110-piper-tts
ffmpeg_executable = C:/Tools/ffmpeg/ffmpeg-7.1-essentials_build/bin/ffmpeg.exe
zid_script = U:/voothi/20241116203211-zid/zid.py

[tts_settings]
default_lang = en
duplicate_mode = zid-dir
keep_lang_postfix = true
primary_languages = en, de
timeline_source = primary_audio_or_subtitle_fallback
reuse_canonical_output = true
auto_discover_canonical = true
cleanup_sidecar_on_success = true
vad_silence_compression = true
vad_max_silence_seconds = 0.15
high_quality_time_stretch = true
